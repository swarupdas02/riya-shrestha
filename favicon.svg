<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching site palette: Slate 900 to Deep Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Text / Emblem Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Stylized Decorative Accent: Small Emerald Trust Pip in top right -->
  <circle cx="396" cy="116" r="24" fill="#10b981"/>
  <circle cx="396" cy="116" r="34" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Interlocking / Stylized 'RS' Monogram -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="228" letter-spacing="-8">
    <!-- 'R' in Crisp Gradient White -->
    <text x="110" y="336" fill="url(#accentGrad)">R</text>
    <!-- 'S' in Indigo Accent Color with Slight Overlap -->
    <text x="242" y="336" fill="#818cf8">S</text>
  </g>

  <!-- Clean Bottom Anchor Baseline -->
  <rect x="120" y="364" width="272" height="10" rx="5" fill="#6366f1" opacity="0.8"/>
</svg>
